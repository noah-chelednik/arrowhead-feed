[project]
name = "arrowhead-feed"
version = "1.0.0"
description = "Deterministic weekly job feed for Arrowhead III: fetch public hiring boards, match role families and a location rule, report only what is new."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
arrowhead-feed = "arrowhead_feed.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arrowhead_feed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
